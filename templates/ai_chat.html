{% extends "base.html" %}

{% block content %}
<style>
    .ai-chat-container {
        max-width: 850px;
        margin: 20px auto;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        height: 80vh;
        box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .ai-header {
        padding: 16px 20px;
        background: #090d16;
        border-bottom: 1px solid #1e293b;
        border-radius: 16px 16px 0 0;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .ai-chat-box {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .chat-bubble {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 14px;
        font-size: 0.95rem;
        line-height: 1.5;
    }

    .user-bubble {
        align-self: flex-end;
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 2px;
    }

    .ai-bubble {
        align-self: flex-start;
        background: #1e293b;
        color: #f1f5f9;
        border: 1px solid #334155;
        border-bottom-left-radius: 2px;
    }

    .ai-input-area {
        padding: 15px;
        border-top: 1px solid #1e293b;
        background: #090d16;
        border-radius: 0 0 16px 16px;
        display: flex;
        gap: 10px;
    }
</style>

<div class="ai-chat-container">
    <!-- Header -->
    <div class="ai-header">
        <div style="width: 38px; height: 38px; background: #064e3b; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            🤖
        </div>
        <div>
            <h3 style="margin: 0; color: white; font-size: 1.05rem;">ChatGPT Assistant</h3>
            <span style="color: #10b981; font-size: 0.75rem;">● Online & Ready</span>
        </div>
    </div>

    <!-- Chat Messages Scroll Area -->
    <div class="ai-chat-box" id="chatBox">
        <div class="chat-bubble ai-bubble">
            Hello @{{ current_user.username }}! 👋 I am your AI assistant powered by Groq. How can I help you today? 🚀✨
        </div>
    </div>

    <!-- Message Input -->
    <form id="aiForm" onsubmit="sendAiMessage(event)" class="ai-input-area">
        <input type="text" id="userInput" placeholder="Ask AI anything..." class="cmd-input" style="flex: 1;" required autocomplete="off">
        <button type="submit" class="cmd-btn" style="padding: 10px 20px;">Send 🚀</button>
    </form>
</div>

<script>
    async function sendAiMessage(e) {
        e.preventDefault();
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();
        if(!text) return;

        // Append User Message
        const userDiv = document.createElement('div');
        userDiv.className = 'chat-bubble user-bubble';
        userDiv.innerText = text;
        chatBox.appendChild(userDiv);
        
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Append Loading State
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'chat-bubble ai-bubble';
        loadingDiv.innerText = 'AI is thinking... 🧠💭';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        // Send API request to backend
        try {
            const response = await fetch("{{ url_for('ask_ai') }}", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ "prompt": text })
            });
            const data = await response.json();
            loadingDiv.innerText = data.reply;
        } catch(err) {
            loadingDiv.innerText = "Error contacting AI service. Please try again later! ❌";
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
{% endblock %}
