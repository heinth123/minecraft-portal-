<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>root@minecraft-myanmar:~# dir /s</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        .cmd-header {
            color: #ffffff;
            margin-bottom: 20px;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
        }
        .file-line {
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
            opacity: 0;
            animation: fadeInLine 0.05s forwards;
        }
        @keyframes fadeInLine {
            to { opacity: 1; }
        }
        .folder-header {
            color: #38bdf8;
            margin-top: 15px;
            font-weight: bold;
        }
        .summary {
            margin-top: 30px;
            color: #fbbf24;
            border-top: 1px dashed #00ff66;
            padding-top: 15px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background: #00ff66;
            color: #000;
            padding: 8px 16px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }
        .back-btn:hover {
            background: #34d399;
        }
    </style>
</head>
<body>

    <div class="cmd-header">
        Directory of root@minecraft-myanmar:/app/database<br>
        Executing recursive scan (/dir/s)... Please wait...
    </div>

    <div id="terminal-output"></div>

    <div class="summary" id="scan-summary" style="display: none;">
        <p>Total Files Analyzed: <span id="file-count">0</span></p>
        <p>System Integrity: 100% SECURE</p>
        <a href="{{ url_for('admin_panel') }}" class="back-btn">&lt;&lt; Return to Admin Console</a>
    </div>

<script>
    // Raw data injected from Flask backend
    const rawUsers = {{ users | tojson }};
    const rawPosts = {{ posts | tojson }};
    const systemInfo = {{ info | tojson }};

    const outputContainer = document.getElementById('terminal-output');
    let delay = 0;

    function addLine(text, className = '') {
        setTimeout(() => {
            const div = document.createElement('div');
            div.className = `file-line ${className}`;
            div.innerText = text;
            outputContainer.appendChild(div);
            window.scrollTo(0, document.body.scrollHeight);
        }, delay);
        delay += 35; // Speed of scrolling text lines
    }

    // Simulate CMD directory tree output
    addLine("Volume in drive C is SYSTEM_CORE");
    addLine("Volume Serial Number: 40A8-99EF");
    addLine("");
    addLine("Directory of C:\\app\\config", "folder-header");
    addLine("12/08/2026  09:50 AM    <DIR>          .");
    addLine("12/08/2026  09:50 AM    <DIR>          ..");
    addLine("12/08/2026  09:50 AM             1,024 server_env.json");
    addLine(`12/08/2026  09:50 AM               512 database_status.log [OS: ${systemInfo.os_env}]`);

    addLine("");
    addLine("Directory of C:\\app\\database\\users", "folder-header");
    rawUsers.forEach(user => {
        addLine(`12/08/2026  09:50 AM             2,048 usr_id_${user.id}_${user.username}.db [Role: ${user.is_admin ? 'ADMIN' : 'MEMBER'}, Verified: ${user.is_verified}]`);
    });

    addLine("");
    addLine("Directory of C:\\app\\database\\posts", "folder-header");
    rawPosts.forEach(post => {
        addLine(`12/08/2026  09:50 AM             4,096 post_id_${post.id}_feed_${post.feed_type}.dat`);
    });

    addLine("");
    addLine("Directory of C:\\app\\system_metrics", "folder-header");
    addLine(`12/08/2026  09:50 AM            12,288 total_users_registry.bin (${systemInfo.total_users} records)`);
    addLine(`12/08/2026  09:50 AM            24,576 community_posts_index.bin (${systemInfo.total_posts} records)`);
    addLine("12/08/2026  09:50 AM             8,192 security_firewall_rules.cfg");

    // Final summary trigger
    setTimeout(() => {
        document.getElementById('file-count').innerText = rawUsers.length + rawPosts.length + 5;
        document.getElementById('scan-summary').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }, delay + 100);
</script>

</body>
</html>
