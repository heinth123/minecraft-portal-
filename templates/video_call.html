{% extends "base.html" %}

{% block title %}Video Call with {{ target_user.nickname }}{% endblock %}

{% block content %}
<!-- Include PeerJS Library -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<div style="max-width: 900px; margin: 30px auto; padding: 20px; text-align: center; color: white;">
    <h2 style="color: #38bdf8;">📞 Calling {{ target_user.nickname }}</h2>
    <p id="call-status" style="color: #94a3b8;">Connecting camera and microphone...</p>

    <!-- Video Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
        <!-- Local Camera Feed -->
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px;">
            <p style="margin-bottom: 8px; color: #cbd5e1;">You (Local)</p>
            <video id="localVideo" autoplay muted style="width: 100%; height: 240px; background: #0f172a; border-radius: 8px; object-fit: cover;"></video>
        </div>

        <!-- Remote Camera Feed -->
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px;">
            <p style="margin-bottom: 8px; color: #38bdf8;">{{ target_user.nickname }}</p>
            <video id="remoteVideo" autoplay style="width: 100%; height: 240px; background: #0f172a; border-radius: 8px; object-fit: cover;"></video>
        </div>
    </div>

    <!-- Call Controls -->
    <div style="margin-top: 25px;">
        <a href="{{ url_for('profile', username=target_user.username) }}" style="background: #ef4444; color: white; border: none; padding: 12px 28px; border-radius: 25px; font-weight: bold; text-decoration: none; display: inline-block;">
            🚫 End Call
        </a>
    </div>
</div>

<script>
    const currentUserId = "{{ current_user.id }}";
    const targetUserId = "{{ target_user.id }}";

    // Initialize PeerJS with unique ID
    const peer = new Peer('minecraft-user-' + currentUserId);

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const statusText = document.getElementById('call-status');

    // Get media stream (Camera & Mic)
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            localVideo.srcObject = stream;
            statusText.innerText = "Camera ready! Calling {{ target_user.nickname }}...";

            // Call the target user
            const call = peer.call('minecraft-user-' + targetUserId, stream);
            
            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                statusText.innerText = "Connected! 🟢";
            });

            // Answer incoming call
            peer.on('call', incomingCall => {
                incomingCall.answer(stream);
                incomingCall.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                    statusText.innerText = "Connected! 🟢";
                });
            });
        })
        .catch(err => {
            console.error("Failed to get local stream", err);
            statusText.innerText = "⚠️ Please allow camera & microphone permissions!";
        });
</script>
{% endblock %}
